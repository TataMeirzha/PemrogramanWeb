<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Pencatatan Hasil Panen</title>

<link rel="stylesheet" href="PHP.css">

</head>

<body>

<header>
<h1>Sistem Pencatatan Hasil Panen</h1>
<p>Kelola data hasil panen petani</p>
</header>
 <img src="BANNER.PNG" alt="banner">
<div class="container">

<div class="card">

<h2>Input Data Hasil Panen</h2>

<form id="panenForm">

<label>Tanggal Panen</label>
<input type="date" id="tanggal" required>

<label>Nama Petani</label>
<input type="text" id="petani" required>

<label>Komoditas</label>
<select id="komoditas">
<option>Padi</option>
<option>Jagung</option>
<option>Cabai</option>
<option>Kedelai</option>
</select>

<label>Jumlah Panen</label>
<input type="number" id="jumlah" required>

<label>Satuan</label>
<select id="satuan">
<option>Kg</option>
<option>Ton</option>
</select>

<label>Lokasi Lahan</label>
<select id="lokasi">
<option>Lahan A</option>
<option>Lahan B</option>
<option>Lahan C</option>
</select>

<button type="submit">Simpan Data</button>

</form>

</div>


<div class="card">

<h2>Riwayat Hasil Panen</h2>

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Petani</th>
<th>Komoditas</th>
<th>Jumlah</th>
<th>Lokasi</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabelPanen"></tbody>

</table>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
